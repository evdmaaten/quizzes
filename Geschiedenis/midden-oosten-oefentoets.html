<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Midden-Oosten oefentoets</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --ink: #1f2937;
      --muted: #64748b;
      --brand: #1e3a8a;
      --line: #d8e2ee;
      --good: #d1fae5;
      --bad: #fee2e2;
      --note: #fff7ed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
    }
    .wrap { max-width: 940px; margin: 0 auto; padding: 28px 18px 48px; }
    .quiz-container {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      padding: 24px;
    }
    .topbar { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 34px); }
    .subtitle { margin: 6px 0 0; color: var(--muted); }
    .pill {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      color: var(--muted);
      background: #f8fafc;
      font-size: 14px;
      white-space: nowrap;
    }
    .meter { width: 100%; height: 10px; background: #e5e7eb; border-radius: 999px; overflow: hidden; margin: 20px 0; }
    .meter span { display: block; height: 100%; width: 0%; background: var(--brand); transition: width .2s ease; }
    .context { border-left: 4px solid #f59e0b; background: var(--note); padding: 12px 14px; margin: 0 0 16px; color: #7c2d12; }
    .question { font-size: 1.22rem; font-weight: 700; margin-bottom: 16px; }
    .answers button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      margin: 10px 0;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-size: 1rem;
    }
    .answers button:hover:not(:disabled) { background: #eef2ff; border-color: #93c5fd; }
    .answers button.correct { background: var(--good); border-color: #10b981; }
    .answers button.incorrect { background: var(--bad); border-color: #ef4444; }
    .result, .explanation { margin-top: 16px; font-weight: 700; }
    .explanation { color: #334155; font-weight: 400; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    .btn {
      display: inline-block;
      padding: 11px 14px;
      border: none;
      border-radius: 8px;
      background: var(--brand);
      color: white;
      text-decoration: none;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn.secondary { background: #475569; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .final-list { margin-top: 18px; padding-left: 20px; }
    .final-list li { margin: 8px 0; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="quiz-container">
      <div class="topbar">
        <div>
          <h1>Midden-Oosten oefentoets</h1>
          <p class="subtitle">Gebaseerd op de reader Midden-Oosten en de oefentoets.</p>
        </div>
        <span class="pill" id="category">Start</span>
      </div>
      <div class="pill" id="score">Score: 0 / 0</div>
      <div class="meter" aria-hidden="true"><span id="progress"></span></div>
      <div class="context" id="context" hidden></div>
      <div class="question" id="question"></div>
      <div class="answers" id="answers"></div>
      <div class="result" id="result"></div>
      <div class="explanation" id="explanation"></div>
      <div class="actions">
        <button class="btn" id="nextBtn" disabled>Volgende vraag</button>
        <button class="btn secondary" id="restartBtn">Opnieuw oefenen</button>
        <a class="btn secondary" href="index.html">Terug naar Geschiedenis</a>
      </div>
    </section>
  </main>

          ["Witboek - Balfour-verklaring - Holocaust - Peel-commissie - Suez-crisis - Al-Naqba", false],
          ["Holocaust - Peel-commissie - Balfour-verklaring - Witboek - Al-Naqba - Suez-crisis", false]

      },
      {

        options: [

      {

        ],

      },

        category: "Oorlogen",
        question: "Welke gebieden veroverde Israel in 1967?",

        options: [

          ["Wederzijdse afwijzing en Frans bestuur in delen van Irak en Syrie.", false],

        ],
        explanation: "Oslo gaf hoop op vrede, maar loste grenzen, Jeruzalem, vluchtelingen en nederzettingen niet definitief op."
      },
      {
        category: "Oslo",
        question: "Welke combinatie verklaart het vastlopen van Oslo het best?",

      },
      {

        options: [

      {

        options: [

          ["Het Witboek van 1939 en de daaropvolgende Franse militaire reactie.", false],
          ["De Peel-verdeling van 1937 en de daaropvolgende Ottomaanse militaire reactie.", false]
        ],
        explanation: "De reader noemt 7 oktober, gijzelaars, dodelijk geweld en daarna de oorlog in Gaza."
      },
      {
        category: "Toetsvaardigheid",
        context: "Een toetsvraag begint met: 'Leg uit dat ...'",
        question: "Welke antwoordvorm levert meestal de meeste punten op?",
        options: [
          ["Een oorzaak-gevolgketen met begrippen, jaartallen en een duidelijke conclusie.", true],
          ["Een opsomming van losse feiten zonder verband en zonder conclusie.", false],
          ["Een persoonlijke mening met weinig begrippen en zonder jaartallen.", false],
          ["Een bronbeschrijving zonder context en zonder historisch verband.", false]
        ],
        explanation: "Bij 'leg uit' moet je zichtbaar redeneren: doordat..., daardoor..., dus..."
      }
    ];

    let order = [];
    let optionOrder = [];
    let current = 0;
    let score = 0;
    let answered = false;
    let missed = [];

    const categoryEl = document.getElementById("category");
    const scoreEl = document.getElementById("score");
    const progressEl = document.getElementById("progress");
    const contextEl = document.getElementById("context");
    const questionEl = document.getElementById("question");
    const answersEl = document.getElementById("answers");
    const resultEl = document.getElementById("result");
    const explanationEl = document.getElementById("explanation");
    const nextBtn = document.getElementById("nextBtn");
    const restartBtn = document.getElementById("restartBtn");

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function start() {
      order = shuffle(quiz.map((_, index) => index));
      current = 0;
      score = 0;
      missed = [];
      loadQuestion();
    }

    function loadQuestion() {
      answered = false;
      nextBtn.disabled = true;
      resultEl.textContent = "";
      explanationEl.textContent = "";
      answersEl.innerHTML = "";

      const q = quiz[order[current]];
      optionOrder = shuffle(q.options.map((_, index) => index));
      categoryEl.textContent = q.category;
      questionEl.textContent = `${current + 1}. ${q.question}`;
      scoreEl.textContent = `Score: ${score} / ${current}`;
      progressEl.style.width = `${(current / quiz.length) * 100}%`;

      if (q.context) {
        contextEl.hidden = false;
        contextEl.textContent = q.context;
      } else {
        contextEl.hidden = true;
        contextEl.textContent = "";
      }

      optionOrder.forEach((optionIndex) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = q.options[optionIndex][0];
        btn.onclick = () => selectAnswer(optionIndex);
        answersEl.appendChild(btn);
      });
    }

    function selectAnswer(optionIndex) {
      if (answered) return;
      answered = true;

      const q = quiz[order[current]];
      const buttons = answersEl.querySelectorAll("button");
      const correctOptionIndex = q.options.findIndex(option => option[1]);

      buttons.forEach((btn, renderedIndex) => {
        const originalIndex = optionOrder[renderedIndex];
        btn.disabled = true;
        if (originalIndex === correctOptionIndex) btn.classList.add("correct");
        if (originalIndex === optionIndex && originalIndex !== correctOptionIndex) btn.classList.add("incorrect");
      });

      if (q.options[optionIndex][1]) {
        score++;
        resultEl.textContent = "Goed.";
      } else {
        missed.push(q);
        resultEl.textContent = "Nog niet goed.";
      }

      explanationEl.textContent = q.explanation;
      scoreEl.textContent = `Score: ${score} / ${current + 1}`;
      nextBtn.disabled = false;
    }

    function finish() {
      const percentage = Math.round((score / quiz.length) * 100);
      categoryEl.textContent = "Klaar";
      progressEl.style.width = "100%";
      contextEl.hidden = true;
      questionEl.textContent = "Quiz afgerond.";
      answersEl.innerHTML = "";
      resultEl.textContent = `Eindscore: ${score} / ${quiz.length} (${percentage}%).`;

      if (missed.length === 0) {
        explanationEl.textContent = "Sterk. Je beheerst de kernverbanden.";
      } else {
        explanationEl.innerHTML = "Herhaal vooral deze onderdelen:";
        const list = document.createElement("ul");
        list.className = "final-list";
        missed.slice(0, 8).forEach(item => {
          const li = document.createElement("li");
          li.textContent = `${item.category}: ${item.question}`;
          list.appendChild(li);
        });
        explanationEl.appendChild(list);
      }

      nextBtn.disabled = true;
    }

    nextBtn.onclick = () => {
      current++;
      if (current < quiz.length) loadQuestion();
      else finish();
    };
    restartBtn.onclick = start;
    start();
  </script>
<script>
(function () {
  const hardQuestions = [
    {
      type: "open",
      category: "Uitleg",
      question: "Leg uit waarom de Balfour-verklaring later kon worden omschreven als '100 jaar ongemak'.",
      context: "Gebruik in je antwoord zowel het Joodse als het Arabisch-Palestijnse perspectief.",
      model: "De verklaring steunde een Joods nationaal tehuis in Palestina, terwijl daar al een Arabische meerderheid woonde. De rechten van die niet-Joodse gemeenschappen werden vaag beschermd. Daardoor ontstonden botsende verwachtingen over hetzelfde gebied, wat later doorwerkte in de strijd rond Israel en Palestina.",
      checklist: ["Joods nationaal tehuis genoemd", "Arabische meerderheid/rechten genoemd", "botsende claims of verwachtingen uitgelegd"]
    },
    {
      type: "order",
      category: "Chronologie",
      question: "Zet deze gebeurtenissen in de juiste volgorde van vroeg naar laat.",
      items: ["Balfour-verklaring", "Peel-commissie", "Witboek", "Holocaust", "Al-Naqba", "Suez-crisis"],
      explanation: "De juiste volgorde is 1917, 1937, 1939, 1941-1945, 1948 en 1956."
    },
    {
      type: "multi",
      category: "Ottomaanse Rijk",
      question: "Welke vier oorzaken droegen bij aan het machtsverlies van het Ottomaanse Rijk?",
      options: [
        ["technologische achterstand op West-Europa", true],
        ["Russische expansie richting Zwarte Zee en Kaukasus", true],
        ["economisch verval en afhankelijkheid van Europese handel", true],
        ["opkomend nationalisme van onderworpen volken", true],
        ["succesvolle democratisering door de sultan", false],
        ["volledige militaire steun van Arabische nationalisten", false]
      ],
      explanation: "De reader noemt onder meer technologische achterstand, Russische druk, economisch verval, zwakke sultans en nationalisme."
    },
    {
      type: "match",
      category: "Begrippen",
      question: "Koppel elk begrip aan de juiste betekenis.",
      pairs: [
        ["Zionisme", "streven naar een Joods nationaal tehuis"],
        ["Mandaatgebied", "bestuur namens de Volkenbond door een Europese macht"],
        ["Al-Naqba", "Palestijnse ramp van vlucht en verdrijving rond 1948"],
        ["Turkificatie", "minderheden aanpassen aan Turkse taal en identiteit"]
      ],
      explanation: "Deze begrippen komen direct terug in de reader en oefentoets."
    },
    {
      type: "open",
      category: "Suez",
      question: "Leg uit dat de Suez-crisis past bij verzet tegen Europees modern imperialisme.",
      model: "Nasser nationaliseerde het Suezkanaal, terwijl Groot-Brittannie en Frankrijk daar nog grote strategische en economische belangen hadden. Hun militaire reactie liet zien dat zij koloniale invloed wilden behouden. Het mislukken daarvan toont juist het afnemende gewicht van Europese imperialistische machten.",
      checklist: ["nationalisatie door Nasser", "Brits-Franse belangen", "verband met anti-imperialisme of dekolonisatie"]
    },
    {
      type: "open",
      category: "Oorzaak-gevolg",
      question: "Leg uit hoe de Holocaust onbedoeld bijdroeg aan latere spanningen in Palestina/Israel.",
      model: "Door de Holocaust groeide de internationale steun voor een veilige Joodse staat. De stichting van Israel bood veel Joden bescherming, maar leidde ook tot oorlog, vlucht en verdrijving van veel Palestijnen. Zo werd een oplossing voor Joodse onveiligheid tegelijk een nieuwe bron van conflict.",
      checklist: ["Holocaust als aanleiding voor steun", "stichting Israel genoemd", "gevolgen voor Palestijnen genoemd"]
    },
    {
      type: "multi",
      category: "Oslo",
      question: "Welke factoren verklaren het vastlopen van het Oslo-vredesproces?",
      options: [
        ["discussie over de status van Jeruzalem", true],
        ["nederzettingen en versnippering van Palestijns gebied", true],
        ["aanslagen door Hamas en groeiende Israelische onveiligheid", true],
        ["discussie over terugkeerrecht van Palestijnse vluchtelingen", true],
        ["volledige overeenstemming over definitieve grenzen", false],
        ["directe erkenning van Hamas als vredespartner door alle partijen", false]
      ],
      explanation: "Oslo gaf hoop, maar de moeilijkste onderwerpen bleven onopgelost."
    },
    {
      type: "open",
      category: "Bronvaardigheid",
      question: "Een bron uit de Peel-commissie stelt dat Joden en Arabieren geen gemeenschappelijke nationale basis hebben. Leg uit waarom dat tot een verdelingsvoorstel leidde.",
      model: "De commissie zag twee nationale gemeenschappen met eigen taal, religie, geschiedenis en politieke doelen in hetzelfde kleine gebied. Omdat hun nationale aspiraties volgens de commissie niet te combineren waren, leek verdeling een praktische oplossing.",
      checklist: ["twee nationale gemeenschappen", "botsende aspiraties", "verdeling als gevolg/conclusie"]
    },
    {
      type: "match",
      category: "Personen",
      question: "Koppel de persoon aan zijn rol.",
      pairs: [
        ["Ataturk", "moderniseerde en seculariseerde Turkije"],
        ["Nasser", "nationaliseerde het Suezkanaal"],
        ["Arafat", "leider van de PLO"],
        ["Balfour", "Britse minister achter de verklaring van 1917"]
      ],
      explanation: "Let op: bij toetsvragen moet je personen vaak aan beleid of gevolg kunnen koppelen."
    },
    {
      type: "open",
      category: "Recente geschiedenis",
      question: "Waarom kunnen de Abraham-akkoorden van 2020 als keerpunt worden gezien?",
      model: "Enkele Arabische landen normaliseerden hun betrekkingen met Israel zonder eerst een volledige oplossing voor de Palestijnse kwestie af te wachten. Daardoor verschoof de regionale diplomatie richting samenwerking op gebieden als handel, technologie en veiligheid.",
      checklist: ["normalisatie met Israel", "niet wachten op Palestijnse staat", "regionale samenwerking genoemd"]
    }
  ];

  const els = {
    category: document.getElementById("category"),
    score: document.getElementById("score"),
    progress: document.getElementById("progress"),
    context: document.getElementById("context"),
    question: document.getElementById("question"),
    answers: document.getElementById("answers"),
    result: document.getElementById("result"),
    explanation: document.getElementById("explanation"),
    next: document.getElementById("nextBtn"),
    restart: document.getElementById("restartBtn")
  };
  let order = [], current = 0, score = 0, missed = [], done = false;

  const style = document.createElement("style");
  style.textContent = ".open-answer{width:100%;min-height:130px;border:1px solid #cbd5e1;border-radius:8px;padding:12px;font:inherit}.mixed-row{margin:10px 0}.mixed-row label{display:block;font-weight:700;margin-bottom:6px}.mixed-row select{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:10px;font:inherit}.model-answer{margin-top:14px;padding:12px 14px;border-left:4px solid #2563eb;background:#eff6ff;color:#1e3a8a}.checklist{margin-top:10px}.choice-active{outline:2px solid #2563eb;background:#eef2ff!important}.assessment-buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}";
  document.head.appendChild(style);

  function shuffle(list) {
    const copy = [...list];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function start() {
    order = shuffle(hardQuestions.map((_, i) => i));
    current = 0; score = 0; missed = [];
    load();
  }

  function load() {
    done = false;
    const q = hardQuestions[order[current]];
    els.category.textContent = q.category;
    els.score.textContent = `Score: ${score} / ${current}`;
    els.progress.style.width = `${(current / hardQuestions.length) * 100}%`;
    els.question.textContent = `${current + 1}. ${q.question}`;
    els.answers.innerHTML = "";
    els.result.textContent = "";
    els.explanation.innerHTML = "";
    els.next.disabled = true;
    els.context.hidden = !q.context;
    els.context.textContent = q.context || "";
    if (q.type === "open") renderOpen(q);
    if (q.type === "multi") renderMulti(q);
    if (q.type === "order") renderOrder(q);
    if (q.type === "match") renderMatch(q);
  }

  function mark(ok, q, html) {
    if (ok) score++; else missed.push(q);
    els.score.textContent = `Score: ${score} / ${current + 1}`;
    els.result.textContent = ok ? "Goed." : "Nog niet goed.";
    els.explanation.innerHTML = html || q.explanation || "";
    els.next.disabled = false;
  }

  function renderOpen(q) {
    const area = document.createElement("textarea");
    area.className = "open-answer";
    area.placeholder = "Typ je antwoord in 2-5 zinnen...";
    const btn = document.createElement("button");
    btn.className = "btn";
    btn.textContent = "Toon modelantwoord";
    btn.onclick = () => {
      if (done) return;
      done = true; area.disabled = true;
      const list = q.checklist.map(item => `<li>${item}</li>`).join("");
      els.result.textContent = "Vergelijk je antwoord met het model.";
      els.explanation.innerHTML = `<div class="model-answer">${q.model}</div><ul class="checklist">${list}</ul>`;
      const box = document.createElement("div");
      box.className = "assessment-buttons";
      const good = document.createElement("button");
      good.className = "btn"; good.textContent = "Kern goed";
      const retry = document.createElement("button");
      retry.className = "btn secondary"; retry.textContent = "Nog oefenen";
      good.onclick = () => { good.disabled = retry.disabled = true; mark(true, q, els.explanation.innerHTML); };
      retry.onclick = () => { good.disabled = retry.disabled = true; mark(false, q, els.explanation.innerHTML); };
      box.append(good, retry); els.explanation.appendChild(box);
    };
    els.answers.append(area, btn);
  }

  function renderMulti(q) {
    const selected = new Set();
    shuffle(q.options.map((option, i) => ({ option, i }))).forEach(({ option, i }) => {
      const b = document.createElement("button");
      b.textContent = option[0];
      b.onclick = () => { if (!done) { selected.has(i) ? selected.delete(i) : selected.add(i); b.classList.toggle("choice-active"); } };
      els.answers.appendChild(b);
    });
    const check = document.createElement("button");
    check.className = "btn"; check.textContent = "Controleer antwoord";
    check.onclick = () => {
      if (done) return; done = true;
      const ok = q.options.every((o, i) => selected.has(i) === o[1]);
      els.answers.querySelectorAll("button").forEach(b => {
        b.disabled = true;
        const opt = q.options.find(o => o[0] === b.textContent);
        if (opt && opt[1]) b.classList.add("correct");
        if (opt && !opt[1] && b.classList.contains("choice-active")) b.classList.add("incorrect");
      });
      mark(ok, q);
    };
    els.answers.appendChild(check);
  }

  function renderOrder(q) {
    shuffle(q.items).forEach(item => {
      const row = document.createElement("div");
      row.className = "mixed-row";
      row.innerHTML = `<label>${item}</label><select data-item="${item}"><option value="">Kies positie</option>${q.items.map((_, i) => `<option value="${i + 1}">${i + 1}</option>`).join("")}</select>`;
      els.answers.appendChild(row);
    });
    const check = document.createElement("button");
    check.className = "btn"; check.textContent = "Controleer volgorde";
    check.onclick = () => {
      if (done) return; done = true;
      const selects = [...els.answers.querySelectorAll("select")];
      const used = selects.map(s => s.value).filter(Boolean);
      const ok = used.length === q.items.length && new Set(used).size === q.items.length && selects.every(s => Number(s.value) === q.items.indexOf(s.dataset.item) + 1);
      selects.forEach(s => s.disabled = true);
      mark(ok, q, ok ? q.explanation : `${q.explanation}<div class="model-answer">${q.items.map((x, i) => `${i + 1}. ${x}`).join("<br>")}</div>`);
    };
    els.answers.appendChild(check);
  }

  function renderMatch(q) {
    const defs = shuffle(q.pairs.map(pair => pair[1]));
    q.pairs.forEach(pair => {
      const row = document.createElement("div");
      row.className = "mixed-row";
      row.innerHTML = `<label>${pair[0]}</label><select data-term="${pair[0]}"><option value="">Kies uitleg</option>${defs.map(d => `<option value="${d}">${d}</option>`).join("")}</select>`;
      els.answers.appendChild(row);
    });
    const check = document.createElement("button");
    check.className = "btn"; check.textContent = "Controleer koppelingen";
    check.onclick = () => {
      if (done) return; done = true;
      const ok = [...els.answers.querySelectorAll("select")].every(s => q.pairs.find(p => p[0] === s.dataset.term)[1] === s.value);
      els.answers.querySelectorAll("select").forEach(s => s.disabled = true);
      const model = q.pairs.map(p => `<strong>${p[0]}</strong>: ${p[1]}`).join("<br>");
      mark(ok, q, ok ? q.explanation : `${q.explanation}<div class="model-answer">${model}</div>`);
    };
    els.answers.appendChild(check);
  }

  function finish() {
    els.category.textContent = "Klaar";
    els.progress.style.width = "100%";
    els.context.hidden = true;
    els.question.textContent = "Quiz afgerond.";
    els.answers.innerHTML = "";
    els.result.textContent = `Eindscore: ${score} / ${hardQuestions.length}.`;
    els.explanation.innerHTML = missed.length ? "Herhaal vooral: " + missed.map(q => q.category).join(", ") : "Sterk. Je kunt de kernstof ook uitleggen.";
    els.next.disabled = true;
  }

  els.next.onclick = () => { current++; current < hardQuestions.length ? load() : finish(); };
  els.restart.onclick = start;
  start();
})();
</script>
</body>
