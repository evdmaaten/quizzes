<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Midden-Oosten oefentoets</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --ink: #1f2937;
      --muted: #64748b;
      --brand: #1e3a8a;
      --line: #d8e2ee;
      --good: #d1fae5;
      --bad: #fee2e2;
      --note: #fff7ed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
    }
    .wrap { max-width: 940px; margin: 0 auto; padding: 28px 18px 48px; }
    .quiz-container {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      padding: 24px;
    }
    .topbar { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 34px); }
    .subtitle { margin: 6px 0 0; color: var(--muted); }
    .pill {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      color: var(--muted);
      background: #f8fafc;
      font-size: 14px;
      white-space: nowrap;
    }
    .meter { width: 100%; height: 10px; background: #e5e7eb; border-radius: 999px; overflow: hidden; margin: 20px 0; }
    .meter span { display: block; height: 100%; width: 0%; background: var(--brand); transition: width .2s ease; }
    .context { border-left: 4px solid #f59e0b; background: var(--note); padding: 12px 14px; margin: 0 0 16px; color: #7c2d12; }
    .question { font-size: 1.22rem; font-weight: 700; margin-bottom: 16px; }
    .answers button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      margin: 10px 0;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-size: 1rem;
    }
    .answers button:hover:not(:disabled) { background: #eef2ff; border-color: #93c5fd; }
    .answers button.correct { background: var(--good); border-color: #10b981; }
    .answers button.incorrect { background: var(--bad); border-color: #ef4444; }
    .result, .explanation { margin-top: 16px; font-weight: 700; }
    .explanation { color: #334155; font-weight: 400; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    .btn {
      display: inline-block;
      padding: 11px 14px;
      border: none;
      border-radius: 8px;
      background: var(--brand);
      color: white;
      text-decoration: none;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn.secondary { background: #475569; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .final-list { margin-top: 18px; padding-left: 20px; }
    .final-list li { margin: 8px 0; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="quiz-container">
      <div class="topbar">
        <div>
          <h1>Midden-Oosten oefentoets</h1>
          <p class="subtitle">Gebaseerd op de reader Midden-Oosten en de oefentoets.</p>
        </div>
        <span class="pill" id="category">Start</span>
      </div>
      <div class="pill" id="score">Score: 0 / 0</div>
      <div class="meter" aria-hidden="true"><span id="progress"></span></div>
      <div class="context" id="context" hidden></div>
      <div class="question" id="question"></div>
      <div class="answers" id="answers"></div>
      <div class="result" id="result"></div>
      <div class="explanation" id="explanation"></div>
      <div class="actions">
        <button class="btn" id="nextBtn" disabled>Volgende vraag</button>
        <button class="btn secondary" id="restartBtn">Opnieuw oefenen</button>
        <a class="btn secondary" href="index.html">Terug naar Geschiedenis</a>
      </div>
    </section>
  </main>

          ["Witboek - Balfour-verklaring - Holocaust - Peel-commissie - Suez-crisis - Al-Naqba", false],
          ["Holocaust - Peel-commissie - Balfour-verklaring - Witboek - Al-Naqba - Suez-crisis", false]

      },
      {

        options: [

      {

        ],

      },

        category: "Oorlogen",
        question: "Welke gebieden veroverde Israel in 1967?",

        options: [

          ["Wederzijdse afwijzing en Frans bestuur in delen van Irak en Syrie.", false],

        ],
        explanation: "Oslo gaf hoop op vrede, maar loste grenzen, Jeruzalem, vluchtelingen en nederzettingen niet definitief op."
      },
      {
        category: "Oslo",
        question: "Welke combinatie verklaart het vastlopen van Oslo het best?",

      },
      {

        options: [

      {

        options: [

          ["Het Witboek van 1939 en de daaropvolgende Franse militaire reactie.", false],
          ["De Peel-verdeling van 1937 en de daaropvolgende Ottomaanse militaire reactie.", false]
        ],
        explanation: "De reader noemt 7 oktober, gijzelaars, dodelijk geweld en daarna de oorlog in Gaza."
      },
      {
        category: "Toetsvaardigheid",
        context: "Een toetsvraag begint met: 'Leg uit dat ...'",
        question: "Welke antwoordvorm levert meestal de meeste punten op?",
        options: [
          ["Een oorzaak-gevolgketen met begrippen, jaartallen en een duidelijke conclusie.", true],
          ["Een opsomming van losse feiten zonder verband en zonder conclusie.", false],
          ["Een persoonlijke mening met weinig begrippen en zonder jaartallen.", false],
          ["Een bronbeschrijving zonder context en zonder historisch verband.", false]
        ],
        explanation: "Bij 'leg uit' moet je zichtbaar redeneren: doordat..., daardoor..., dus..."
      }
    ];

    let order = [];
    let optionOrder = [];
    let current = 0;
    let score = 0;
    let answered = false;
    let missed = [];

    const categoryEl = document.getElementById("category");
    const scoreEl = document.getElementById("score");
    const progressEl = document.getElementById("progress");
    const contextEl = document.getElementById("context");
    const questionEl = document.getElementById("question");
    const answersEl = document.getElementById("answers");
    const resultEl = document.getElementById("result");
    const explanationEl = document.getElementById("explanation");
    const nextBtn = document.getElementById("nextBtn");
    const restartBtn = document.getElementById("restartBtn");

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function start() {
      order = shuffle(quiz.map((_, index) => index));
      current = 0;
      score = 0;
      missed = [];
      loadQuestion();
    }

    function loadQuestion() {
      answered = false;
      nextBtn.disabled = true;
      resultEl.textContent = "";
      explanationEl.textContent = "";
      answersEl.innerHTML = "";

      const q = quiz[order[current]];
      optionOrder = shuffle(q.options.map((_, index) => index));
      categoryEl.textContent = q.category;
      questionEl.textContent = `${current + 1}. ${q.question}`;
      scoreEl.textContent = `Score: ${score} / ${current}`;
      progressEl.style.width = `${(current / quiz.length) * 100}%`;

      if (q.context) {
        contextEl.hidden = false;
        contextEl.textContent = q.context;
      } else {
        contextEl.hidden = true;
        contextEl.textContent = "";
      }

      optionOrder.forEach((optionIndex) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = q.options[optionIndex][0];
        btn.onclick = () => selectAnswer(optionIndex);
        answersEl.appendChild(btn);
      });
    }

    function selectAnswer(optionIndex) {
      if (answered) return;
      answered = true;

      const q = quiz[order[current]];
      const buttons = answersEl.querySelectorAll("button");
      const correctOptionIndex = q.options.findIndex(option => option[1]);

      buttons.forEach((btn, renderedIndex) => {
        const originalIndex = optionOrder[renderedIndex];
        btn.disabled = true;
        if (originalIndex === correctOptionIndex) btn.classList.add("correct");
        if (originalIndex === optionIndex && originalIndex !== correctOptionIndex) btn.classList.add("incorrect");
      });

      if (q.options[optionIndex][1]) {
        score++;
        resultEl.textContent = "Goed.";
      } else {
        missed.push(q);
        resultEl.textContent = "Nog niet goed.";
      }

      explanationEl.textContent = q.explanation;
      scoreEl.textContent = `Score: ${score} / ${current + 1}`;
      nextBtn.disabled = false;
    }

    function finish() {
      const percentage = Math.round((score / quiz.length) * 100);
      categoryEl.textContent = "Klaar";
      progressEl.style.width = "100%";
      contextEl.hidden = true;
      questionEl.textContent = "Quiz afgerond.";
      answersEl.innerHTML = "";
      resultEl.textContent = `Eindscore: ${score} / ${quiz.length} (${percentage}%).`;

      if (missed.length === 0) {
        explanationEl.textContent = "Sterk. Je beheerst de kernverbanden.";
      } else {
        explanationEl.innerHTML = "Herhaal vooral deze onderdelen:";
        const list = document.createElement("ul");
        list.className = "final-list";
        missed.slice(0, 8).forEach(item => {
          const li = document.createElement("li");
          li.textContent = `${item.category}: ${item.question}`;
          list.appendChild(li);
        });
        explanationEl.appendChild(list);
      }

      nextBtn.disabled = true;
    }

    nextBtn.onclick = () => {
      current++;
      if (current < quiz.length) loadQuestion();
      else finish();
    };
    restartBtn.onclick = start;
    start();
  </script>
</body>
</html>
