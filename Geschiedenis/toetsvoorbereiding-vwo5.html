    }

    .wrap {
      max-width: 940px;
      margin: 0 auto;
      padding: 28px 18px 48px;
    }

    .quiz-container {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      padding: 24px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 34px);
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
    }

    .pill {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      color: var(--muted);
      background: #f8fafc;
      font-size: 14px;
      white-space: nowrap;
    }

    .meter {
      width: 100%;
      height: 10px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin: 20px 0;
    }

    .meter span {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--brand);
      transition: width .2s ease;
    }

    .question {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .context {
      border-left: 4px solid #f59e0b;
      background: var(--warn);
      padding: 12px 14px;
      margin: 0 0 16px;
      color: #7c2d12;
    }

    .answers button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      margin: 10px 0;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-size: 1rem;
    }

    .answers button:hover:not(:disabled) {
      background: #eef2ff;
      border-color: #93c5fd;
    }

    .answers button.correct {
      background: var(--good);
      border-color: #10b981;
    }

    .answers button.incorrect {
      background: var(--bad);
      border-color: #ef4444;
    }

    .result, .explanation {
      margin-top: 16px;
      font-weight: 700;
    }

    .explanation {
      color: #334155;
      font-weight: 400;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .btn {
      display: inline-block;
      padding: 11px 14px;
      border: none;
      border-radius: 8px;
      background: var(--brand);
      color: white;
      text-decoration: none;
      cursor: pointer;
      font-size: 1rem;
    }

    .btn.secondary {
      background: #475569;
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .final-list {
      margin-top: 18px;
      padding-left: 20px;
    }

    .final-list li {
      margin: 8px 0;
    }

    @media (max-width: 640px) {
      .quiz-container { padding: 18px; }
      .question { font-size: 1.1rem; }
    }
  </style>

    let order = [];
    let current = 0;
    let score = 0;
    let answered = false;
    let missed = [];

    const categoryEl = document.getElementById("category");
    const scoreEl = document.getElementById("score");
    const progressEl = document.getElementById("progress");
    const contextEl = document.getElementById("context");
    const questionEl = document.getElementById("question");
    const answersEl = document.getElementById("answers");
    const resultEl = document.getElementById("result");
    const explanationEl = document.getElementById("explanation");
    const nextBtn = document.getElementById("nextBtn");
    const restartBtn = document.getElementById("restartBtn");

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function start() {
      order = shuffle(quiz.map((_, index) => index));
      current = 0;
      score = 0;
      missed = [];
      loadQuestion();
    }

    function loadQuestion() {
      answered = false;
      nextBtn.disabled = true;
      resultEl.textContent = "";
      explanationEl.textContent = "";
      answersEl.innerHTML = "";

      const q = quiz[order[current]];
      categoryEl.textContent = q.category;
      questionEl.textContent = `${current + 1}. ${q.question}`;
      scoreEl.textContent = `Score: ${score} / ${current}`;
      progressEl.style.width = `${(current / quiz.length) * 100}%`;

      if (q.context) {
        contextEl.hidden = false;
        contextEl.textContent = q.context;
      } else {
        contextEl.hidden = true;
        contextEl.textContent = "";
      }

      q.options.forEach((option, index) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = option;
        btn.onclick = () => selectAnswer(index);
        answersEl.appendChild(btn);
      });
    }

    function selectAnswer(index) {
      if (answered) return;
      answered = true;

      const q = quiz[order[current]];
      const buttons = answersEl.querySelectorAll("button");

      buttons.forEach((btn, i) => {
        btn.disabled = true;
        if (i === q.answer) btn.classList.add("correct");
        if (i === index && i !== q.answer) btn.classList.add("incorrect");
      });

      if (index === q.answer) {
        score++;
        resultEl.textContent = "Goed.";
      } else {
        missed.push(q);
        resultEl.textContent = "Nog niet goed.";
      }

      explanationEl.textContent = q.explanation;
      scoreEl.textContent = `Score: ${score} / ${current + 1}`;
      nextBtn.disabled = false;
    }

    function finish() {
      const percentage = Math.round((score / quiz.length) * 100);
      categoryEl.textContent = "Klaar";
      progressEl.style.width = "100%";
      contextEl.hidden = true;
      questionEl.textContent = "Quiz afgerond.";
      answersEl.innerHTML = "";
      resultEl.textContent = `Eindscore: ${score} / ${quiz.length} (${percentage}%).`;

      if (missed.length === 0) {
        explanationEl.textContent = "Sterk. Je hebt alle kernverbanden goed.";
      } else {
        explanationEl.innerHTML = "Herhaal vooral deze onderdelen:";
        const list = document.createElement("ul");
        list.className = "final-list";
        missed.slice(0, 8).forEach(item => {
          const li = document.createElement("li");
          li.textContent = `${item.category}: ${item.question}`;
          list.appendChild(li);
        });
        explanationEl.appendChild(list);
      }

      nextBtn.disabled = true;
    }

    nextBtn.onclick = () => {
      current++;
      if (current < quiz.length) {
        loadQuestion();
      } else {
        finish();
      }
    };

    restartBtn.onclick = start;

    start();
  </script>
